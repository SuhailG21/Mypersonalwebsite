<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenpay — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary: #ea6f59;   /* accent */
      --secondary: #084950; /* background */
      --text: #eaf7f9;
      --muted: #b7d6db;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(80rem 80rem at 20% -10%, rgba(234,111,89,.2), transparent 60%),
        radial-gradient(70rem 70rem at 120% 110%, rgba(8,73,80,.7), transparent 60%),
        linear-gradient(180deg, #063d43 0%, var(--secondary) 60%, #06363c 100%);
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(1100px, 96vw);
      border-radius:28px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,0.02);
      padding: clamp(20px, 4vw, 48px);
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Subtle animated accent glow behind card */
    .card::before{
      content:"";
      position:absolute; inset:-60px; z-index:0;
      background:
        radial-gradient(50% 50% at 20% 30%, rgba(234,111,89,.20), transparent 60%),
        radial-gradient(50% 50% at 80% 70%, rgba(234,111,89,.12), transparent 70%),
        radial-gradient(60% 60% at 50% 50%, rgba(8,73,80,.25), transparent 70%);
      filter: blur(30px);
      animation: floatGlow 14s ease-in-out infinite alternate;
    }
    @keyframes floatGlow{from{transform:translateY(-12px)} to{transform:translateY(12px)}}

    .grid{
      position:relative; z-index:1;
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: clamp(24px, 4vw, 48px);
      align-items:center;
    }

    @media (max-width: 900px){
      .grid{grid-template-columns:1fr; text-align:center}
      .cta{align-items:center}
      .device-wrap {
    display: block;
    position: relative;
    width: 100%;
    max-width: 300px; /* or whatever fits nicely */
    margin: 24px auto 0; /* spacing below text */
    aspect-ratio: 9/19.5;
    perspective: 1000px;
}
.card {
    overflow: visible; /* allow inner content to show */
    padding-top: 32px; /* optional: add extra space so top content isn’t cut off */
}

body {
    overflow-x: hidden;
    padding-left: 16px;
    padding-right: 16px;
}

.card {
    width: 100%;
    max-width: 100%;
}


    }

    .eyebrow{letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; font-size:.85rem}

    h1{
      margin:.35rem 0 .5rem;
      font-size:clamp(2rem, 4.5vw, 3.25rem);
      line-height:1.06;
      font-weight:800;
    }

    .accent{color:var(--primary)}

    .lead{
      margin:0 0 1.1rem;
      color:#d5edf1;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      opacity:.95;
    }

    .progress{
      width:100%; max-width:520px; height:12px; border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
      overflow:hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.35);
    }
    .progress > span{
      display:block; height:100%; width:0%; border-radius:999px;
      background:linear-gradient(90deg, rgba(234,111,89,1), rgba(234,111,89,.65));
      animation: load 4s ease-in-out infinite;
    }
    @keyframes load{ 
      0%{width:0%}
      50%{width:82%}
      100%{width:0%}
    }

    .cta{
      display:flex; flex-direction:column; gap:18px; align-items:flex-start;
    }

    .meta{font-size:.9rem; color:var(--muted)}

    /* Device showcase */
    .device-wrap{
      position:relative; width: min(380px, 80vw); margin-inline:auto;
      aspect-ratio: 9/19.5; /* modern phone ratio */
      perspective:1000px;
    }

    .device{
      position:absolute; inset:0; border-radius:28px; overflow:hidden; background:#0b3f45;
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 12px 40px rgba(0,0,0,.45),
        0 0 0 8px rgba(8,73,80,.35) inset;
      transform: rotateY(-8deg) rotateX(3deg);
      transition: transform .6s ease;
    }
    .device-wrap:hover .device{ transform: rotateY(0deg) rotateX(0deg) }

    /* Animated gradient ring behind the device for a premium glow */
    .ring{
      position:absolute; inset:-30px; z-index:-1; filter: blur(18px);
      background: conic-gradient(from 0deg,
        rgba(234,111,89,.55), rgba(234,111,89,.15) 22%,
        rgba(8,73,80,.6) 50%, rgba(234,111,89,.3) 78%,
        rgba(8,73,80,.7));
      border-radius:36px;
      animation: spin 14s linear infinite;
      opacity:.9;
    }
    @keyframes spin{ to{ transform: rotate(360deg) }}

    .device img{
      width:100%; height:100%; object-fit:cover; display:block;
    }

    .badges{ display:flex; gap:12px; flex-wrap:wrap; margin-top:6px }
    .badge{ display:inline-flex; align-items:center; gap:10px; padding:10px 14px; border-radius:999px;
            background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); font-weight:600; }
    .dot{ width:8px; height:8px; border-radius:50%; background:var(--primary) }

    .spacer{height:8px}
  </style>
</head>
<body>
  <main class="card">
    <section class="grid">
      <div class="cta">
        <span class="eyebrow">Mobile App</span>
        <h1>Something <span class="accent">Good</span> is Coming</h1>
        <p class="lead">We’re polishing the Zenpay experience for you. Keep an eye out — our new mobile app is rolling out soon.
        </p>
        <div class="progress" aria-label="Loading progress"><span></span></div>
      
        <div class="spacer"></div>
        <div class="badges" aria-hidden="true">
          <div class="badge"><span class="dot"></span>Push notifications</div>
<div class="badge"><span class="dot"></span>Device lock</div>
<div class="badge"><span class="dot"></span>Biometric login & Transactions</div>

        </div>
      </div>

      <div class="device-wrap" aria-label="App preview area">
        <div class="ring"></div>
        <div class="device">
          <!-- Replace the src below with your app screenshot or mockup -->
          <img src="https://stage.apzbsp.com/content/images/CUnJeXmYIhL7Gy9CdTHeeIlN8kpWM75b0mtDaOdsQOhPXKgMnXsX6JumKCg3fuc9_1024x1536.png" alt="Zenpay app preview placeholder" />
        </div>
      </div>
    </section>
  </main>
</body>
</html>
