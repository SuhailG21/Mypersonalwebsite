<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container" style="width: 100%; height: 500px;">
  <div id="tradingview_widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "width": "100%",                // Full width for responsiveness
      "height": "100%",               // Flexible height
      "autosize": true,               // Auto-adjust to container size (mobile friendly)
      "symbol": "BINANCE:USDTZAR",    // Default chart pair
      "interval": "D",                // D = daily, you can change if needed
      "timezone": "Etc/UTC",
      "theme": "dark",                // Dark mode
      "style": "1",                   // 1 = Candlesticks
      "locale": "en",
      "hide_side_toolbar": false,     // Keep drawing tools
      "hide_top_toolbar": false,      // Show top bar with timeframes
      "withdateranges": true,         // Keep quick date ranges
      "hide_volume": true,            // ✅ Hides the volume/candles at the bottom
      "allow_symbol_change": true,    // User can change pair if allowed
      "container_id": "tradingview_widget"
    });
  </script>
</div>
<!-- TradingView Widget END -->
