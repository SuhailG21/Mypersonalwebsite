<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Price Chart (ZAR)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #121212;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 15px 0;
  }

  input, button {
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }

  input:hover, button:hover {
    border-color: #ea6f59;
  }

  button.active {
    background: #ea6f59;
    border-color: #ea6f59;
    color: #fff;
  }

  #chart-container {
    width: 95%;
    max-width: 1200px;
    height: 75vh;
    position: relative;
  }

  canvas {
    width: 100% !important;
    height: 100% !important;
  }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 1rem;
    display: none;
  }

  #searchContainer {
    position: relative;
  }

  #cryptoSearch {
    width: 200px;
  }

  #searchResults {
    position: absolute;
    top: 36px;
    width: 100%;
    max-height: 250px;
    overflow-y: auto;
    background-color: #1e1e1e;
    border: 1px solid #333;
    border-radius: 6px;
    display: none;
    z-index: 10;
  }

  .search-result {
    display: flex;
    align-items: center;
    padding: 6px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .search-result:hover,
  .search-result.highlight {
    background-color: #333;
  }

  .search-result img {
    margin-right: 8px;
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<header>
  <div id="searchContainer">
    <input type="text" id="cryptoSearch" placeholder="Search coin...">
    <div id="searchResults"></div>
  </div>

  <div id="intervalButtons">
    <button data-days="1" class="interval">1D</button>
    <button data-days="7" class="interval">1W</button>
    <button data-days="30" class="interval active">1M</button>
    <button data-days="90" class="interval">3M</button>
    <button data-days="180" class="interval">6M</button>
    <button data-days="365" class="interval">1Y</button>
  </div>

  <button id="crosshairToggle" title="Toggle Crosshair" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:4px; border-radius:6px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="2" x2="12" y2="22"></line>
      <line x1="2" y1="12" x2="22" y2="12"></line>
    </svg>
  </button>
</header>

<div id="chart-container">
  <canvas id="cryptoChart"></canvas>
  <div id="loading">Loading chart...</div>
</div>

<script>
const ctx = document.getElementById('cryptoChart').getContext('2d');
const loadingEl = document.getElementById('loading');
let chart;
let currentCoin = { id: "bitcoin", name:"Bitcoin", symbol:"BTC" };
let currentDays = 30;
let crosshairEnabled = false;

let topCoins = [];
let highlightedIndex = -1;

// Fetch top coins with logos
async function fetchTopCoins() {
  try {
    const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1');
    const coins = await response.json();
    topCoins = coins.map(coin => ({
      id: coin.id,
      name: coin.name,
      symbol: coin.symbol,
      image: coin.image
    }));
  } catch(e) {
    console.error('Error fetching coins:', e);
  }
}

fetchTopCoins();

// Search functionality
const searchInput = document.getElementById('cryptoSearch');
const resultsDiv = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  if (!query) {
    resultsDiv.style.display = 'none';
    return;
  }
  const filteredCoins = topCoins.filter(coin => coin.name.toLowerCase().includes(query) || coin.symbol.toLowerCase().includes(query));
  resultsDiv.innerHTML = '';
  filteredCoins.forEach((coin, index) => {
    const div = document.createElement('div');
    div.classList.add('search-result');
    div.innerHTML = `<img src="${coin.image}" alt="${coin.name}"><span>${coin.name} (${coin.symbol.toUpperCase()})</span>`;
    div.addEventListener('click', () => selectCoin(coin));
    resultsDiv.appendChild(div);
  });
  highlightedIndex = -1;
  resultsDiv.style.display = filteredCoins.length ? 'block' : 'none';
});

searchInput.addEventListener('keydown', (event) => {
  const items = resultsDiv.querySelectorAll('.search-result');
  if (!items.length) return;

  if (event.key === 'ArrowDown') {
    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
    updateHighlight(items);
  } else if (event.key === 'ArrowUp') {
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    updateHighlight(items);
  } else if (event.key === 'Enter' && highlightedIndex >= 0) {
    selectCoin(topCoins[highlightedIndex]);
  }
});

function updateHighlight(items) {
  items.forEach((item, index) => {
    item.classList.toggle('highlight', index === highlightedIndex);
  });
}

function selectCoin(coin) {
  currentCoin = coin;
  searchInput.value = `${coin.name} (${coin.symbol.toUpperCase()})`;
  resultsDiv.style.display = 'none';
  updateChart();
}

// Fetch crypto prices
async function fetchCryptoData(symbol, days) {
  try {
    loadingEl.style.display = "block";
    const res = await axios.get(`https://api.coingecko.com/api/v3/coins/${symbol}/market_chart`, {
      params: { vs_currency: 'zar', days: days }
    });
    loadingEl.style.display = "none";
    return res.data.prices.map(item => ({ x: new Date(item[0]), y: item[1] }));
  } catch (err) {
    console.error('Error fetching data:', err);
    loadingEl.style.display = "none";
    return [];
  }
}

// Update chart
async function updateChart() {
  const data = await fetchCryptoData(currentCoin.id, currentDays);
  if (!data.length) return;

  const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
  gradient.addColorStop(0, "rgba(234,111,89,0.3)");
  gradient.addColorStop(1, "rgba(234,111,89,0)");

  if (chart) {
    chart.data.datasets[0].data = data;
    chart.data.datasets[0].label = `${currentCoin.symbol.toUpperCase()} (ZAR)`;
    chart.data.datasets[0].backgroundColor = gradient;
    chart.update();
    return;
  }

  const priceLabelPlugin = {
    id: 'priceLabel',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea: { right }, scales: { y } } = chart;
      const dataset = chart.data.datasets[0];
      if (!dataset.data.length) return;
      const lastPoint = dataset.data[dataset.data.length - 1];
      const yPos = y.getPixelForValue(lastPoint.y);
      const price = lastPoint.y.toFixed(2);
      ctx.save();
      ctx.font = 'bold 12px Segoe UI';
      ctx.textAlign = 'left';
      const textWidth = ctx.measureText(price).width + 10;
      const xPos = right - textWidth - 5;
      ctx.fillStyle = '#ea6f59';
      ctx.fillRect(xPos, yPos - 10, textWidth, 20);
      ctx.fillStyle = '#fff';
      ctx.fillText(price, xPos + 5, yPos + 5);
      ctx.restore();
    }
  };

  const crosshairPlugin = {
    id: 'crosshair',
    afterDatasetsDraw(chart) {
      if (!crosshairEnabled) return;
      if (!chart._active || !chart._active.length) return;
      const { ctx, chartArea: { top, bottom, left, right } } = chart;
      const activePoint = chart._active[0].element;
      const xPos = activePoint.x;
      const yPos = activePoint.y;
      const value = activePoint.$context.raw;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.moveTo(xPos, top);
      ctx.lineTo(xPos, bottom);
      ctx.moveTo(left, yPos);
      ctx.lineTo(right, yPos);
      ctx.stroke();

      const date = new Date(value.x);
      const dateLabel = date.toLocaleDateString() + " " + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      ctx.fillStyle = 'rgba(30,30,30,0.8)';
      ctx.fillRect(xPos - 50, bottom - 25, 100, 20);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(dateLabel, xPos, bottom - 10);

      const priceLabel = value.y.toFixed(2);
      ctx.fillStyle = 'rgba(30,30,30,0.8)';
      ctx.fillRect(right - 80, yPos - 10, 80, 20);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(priceLabel, right - 40, yPos + 5);
      ctx.restore();
    }
  };

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [{
        label: `${currentCoin.symbol.toUpperCase()} (ZAR)`,
        data: data,
        borderColor: '#ea6f59',
        backgroundColor: gradient,
        fill: true,
        tension: 0.25,
        pointRadius: 0,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 10, right: 10, bottom: 30, left: 10 } },
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false },
        zoom: { pan: { enabled: true, mode: 'x' }, zoom: { enabled: false } }
      },
      scales: {
        x: { 
          type: 'time',
          grid: { color: 'rgba(255,255,255,0.05)', drawTicks:false },
          ticks: { display: false },
        },
        y: { 
          position: 'right',
          grid: { color: 'rgba(255,255,255,0.1)', drawTicks:false },
          ticks: { color: '#aaa', maxTicksLimit: 6 }
        }
      }
    },
    plugins: [priceLabelPlugin, crosshairPlugin]
  });
}

// Interval buttons
document.querySelectorAll(".interval").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".interval").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDays = btn.getAttribute("data-days");
    updateChart();
  });
});

// Crosshair toggle
document.getElementById("crosshairToggle").addEventListener("click", () => {
  crosshairEnabled = !crosshairEnabled;
  const btn = document.getElementById("crosshairToggle");
  btn.style.backgroundColor = crosshairEnabled ? "#ea6f59" : "#1e1e1e";
  chart.update();
});

updateChart();
</script>

</body>
</html>
